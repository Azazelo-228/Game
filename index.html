<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game </title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="field">
    <div class="field__top">
      <p class="field__top-time">Time: <span class="time">00:20</span></p>
      <p class="field__top-score">Score: <span class="score">0</span></p>
    </div>
    <div class="field__game">
      <!-- инровое поле -->
       <div class="item">
        <!-- right = ширина поля - ширина фиг. -->
        <!-- top = высота поля - высота фиг. -->
       </div>
    </div>
    <div class="result">
     <div class="result__box">
      <div class="result__box-info">
        <p class="result__box-info_title">Timeout!</p>
        <p class="result__box-info_score">YOUR SCORE: <span class="result__score-span"></span></p>
      </div>
      <button class="result__button">OK</button>
    </div>
  </div>
  </div>
  <div class="start">
    <button class="start__button active">Start</button>
  </div>
  <script src="./script.js"></script>
</body>
</html>
